[project]
name = "eu-data-skill-demand"
version = "0.1.0"
description = "EU Data Jobs & Skill Demand Analysis"
requires-python = ">=3.11"
dependencies = [
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "streamlit>=1.30.0",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "production_data: Production regression tests requiring the full local dataset (data/raw/freehire_eu_raw.json or .postings_cache.json)",
]
addopts = "-m 'not production_data'"

